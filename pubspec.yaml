name: deadswitch
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  file_picker: ^10.1.9
  firebase_core: ^3.10.0
  firebase_storage: ^12.3.7
  http: ^1.2.2
  shared_preferences: ^2.3.3
  crypto: ^3.0.7
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  shake: ^3.0.0
  flutter_windowmanager_plus: ^1.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#000000"
  image: assets/icon.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png